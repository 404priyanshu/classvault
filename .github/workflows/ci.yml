# Runs the checks that have to pass before main is deployed.
#
# `checks` and `e2e` are separate jobs so a type error reports in under a
# minute rather than waiting behind a browser install and a production build.
#
# No repository secrets are required. Every value below is synthetic: the
# `e2e` specs only exercise signed-out routes (the signed-in job overrides them
# with a local stack's own keys), and `getClaims` returns without a
# network call when the request carries no session cookie, so a well-formed
# but fictional Supabase URL is enough to get past `isSupabaseConfigured`.
# Wiring the real project in would buy nothing and would stop the workflow
# running on forks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://cipipeline.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_not_a_real_key
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  # Cloudflare's documented always-passes test key, not a ClassVault key.
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  CRON_SECRET: ci-placeholder-secret
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role

jobs:
  checks:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only chromium: playwright.config.ts defines exactly one project, and
      # installing the other two engines triples the step for no coverage.
      - run: npx playwright install --with-deps chromium

      # Playwright starts the server itself, but it starts `npm run start`,
      # which needs a build to serve.
      - run: npm run build

      - run: npm run test:e2e

      # `trace: 'retain-on-failure'` only helps if the trace leaves the runner.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7

  # Signed-in journeys against a throwaway local Supabase stack on the runner:
  # sign-up with email confirmation, note upload/search/download, roadmap
  # generation, and a two-student study room. Still no repository secrets --
  # every key below is the stack's own, printed by `supabase status`.
  e2e-signed-in:
    name: End-to-end (signed in)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # `start` applies every migration; the analytics, edge-runtime, and
      # studio containers are not needed here and only slow the pull.
      - run: npx supabase start -x studio,edge-runtime,logflare,vector,imgproxy,supavisor

      # Overrides the synthetic workflow values for this job only. The build
      # reads NEXT_PUBLIC_* at build time, so this has to precede it.
      - name: Point the app at the local stack
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"

      - run: npm run build

      - run: npm run test:e2e:signed-in

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace-signed-in
          path: test-results/
          retention-days: 7
